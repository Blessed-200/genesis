name: GÉNESIS DeepMind-Level Excellence CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Ejecución profunda todos los domingos a la medianoche (Fuzzing, Miri, ASAN)
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================
  # FASE 1 & 6: STATIC ANALYSIS & HIGIENE
  # ==========================================
  static-analysis:
    name: Static Analysis & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: TASK-01 - Rustfmt Exhaustivo
        run: cargo fmt --all -- --check

      - name: TASK-02 - Clippy PEDANTIC
        # Falla si hay warnings. Aplica las reglas pedantic exigidas.
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            -W clippy::pedantic \
            -W clippy::nursery \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc

      - name: TASK-03 & 17 - Rustdoc sin warnings (API Docs)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: TASK-04 - Cargo Deny (Licencias y Arquitectura)
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check

      - name: TASK-05 - Unsafe Surface Audit
        # Falla el CI si encuentra un bloque 'unsafe {' que no tenga un comentario '// SAFETY:' arriba
        run: |
          echo "Auditing unsafe blocks for SAFETY comments..."
          UNSAFE_NO_SAFETY=$(grep -rn "unsafe {" core/ shared/ | grep -v "// SAFETY:" | grep -v "#\[test\]" || true)
          if [ -n "$UNSAFE_NO_SAFETY" ]; then
            echo "ERROR: Found unsafe blocks without SAFETY comments:"
            echo "$UNSAFE_NO_SAFETY"
            exit 1
          else
            echo "All unsafe blocks are properly documented."
          fi

  # ==========================================
  # FASE 2, 3 & 7: CORRECTITUD Y PROPIEDADES
  # ==========================================
  core-tests:
    name: Algebraic & Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: TASK-08 & 09 - Invariantes Físicos y Regresión
        run: cargo test --workspace --release

      - name: TASK-07, 10 & 11 - Property Testing Exhaustivo (Proptest)
        # Ejecuta los tests con la feature 'properties' activada
        env:
          PROPTEST_CASES: 10000 # Sube los casos en CI para mayor rigor
        run: cargo test --workspace --features properties

      - name: TASK-14 - Edge Cases Corpus
        run: |
          cargo test -p genesis-types -- edge_cases sentinel max || true
          cargo test -p genesis-math -- zero_vector nan_input || true
          cargo test -p genesis-topology -- empty_graph sentinel || true

  # ==========================================
  # FASE 5: BENCHMARKS HONESTOS
  # ==========================================
  benchmarks:
    name: Benchmarks Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: TASK-15 - Verificar compilación de Benchmarks
        run: cargo bench --workspace --no-run

      - name: TASK-16 - Guardrail de Synchrony Order
        # Ejecuta solo el benchmark crítico para asegurar que no hay regresión de latencia
        run: cargo bench -p genesis-dynamics --bench dynamics -- synchrony_order_fast

  # ==========================================
  # FASE 8: SAFETY (MIRI) - Solo en Nightly
  # ==========================================
  safety-miri:
    name: Miri Memory Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: TASK-22 - Ejecutar Miri
        # Miri detecta Undefined Behavior (UB), out-of-bounds, y data races
        run: cargo miri test --workspace
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  # ==========================================
  # FASE 8: SAFETY (ASAN) - Solo en Nightly
  # ==========================================
  safety-asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Nightly with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: TASK-23 - Ejecutar ASAN en genesis-math
        # Detecta Use-After-Free y Buffer Overflows en código unsafe (NEON/AVX)
        run: cargo test -p genesis-math --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"

  # ==========================================
  # FASE 4: FUZZ TESTING - Ejecución programada
  # ==========================================
  fuzzing:
    name: Continuous Fuzzing
    # Solo ejecuta el fuzzing si es el evento programado (cron) o si se fuerza manualmente
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: TASK-13 - Ejecutar Fuzz Targets
        # Ejecuta cada target de fuzzing por 60 segundos. 
        # Asume que los targets están inicializados en la carpeta /fuzz
        run: |
          if [ -d "fuzz" ]; then
            for target in $(cargo fuzz list); do
              echo "Fuzzing target: $target for 60 seconds..."
              cargo fuzz run "$target" -- -max_total_time=60
            done
          else
            echo "No fuzz directory found. Skipping fuzzing."
          fi
