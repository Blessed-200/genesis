name: GÉNESIS_ELITE_FORGE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Domingo medianoche: Escaneo profundo
  workflow_dispatch: # Botón manual para cuando tú decidas "Deep Pass"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" 
  LOG_DIR: "genesis_audit_logs"

jobs:
  # ==========================================
  # NIVEL 1: FAST-PASS (Feedback en < 5 min)
  # ==========================================
  fast-pass:
    name: Fast-Pass Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 🛡️ Task-01: Clippy & Fmt (Strict)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D clippy::pedantic -W clippy::nursery -A clippy::module_name_repetitions

      - name: 🔍 Task-02: Unsafe Safety Audit
        # Falla si hay bloques unsafe sin el comentario // SAFETY:
        run: |
          ! grep -rn "unsafe {" core/ shared/ | grep -v "// SAFETY:"

      - name: 🧪 Task-03: Fast Invariants & Unit Tests
        run: cargo test --workspace --lib --bins

      - name: 🚀 Task-04: Critical Bench (Guardrail)
        # Solo corre el benchmark de sincronía para detectar regresiones rápidas
        run: cargo bench -p genesis-dynamics --bench dynamics -- synchrony_order_fast

  # ==========================================
  # NIVEL 2: DEEP-PASS (Manual / Domingo)
  # ==========================================
  deep-pass:
    name: Deep-Pass (Exhaustive Analysis)
    needs: fast-pass # Solo si el Fast-Pass está verde
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2

      - name: Prepare Audit Folder
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "REPORT_PATH=$LOG_DIR/$TIMESTAMP" >> $GITHUB_ENV
          mkdir -p $LOG_DIR/$TIMESTAMP

      - name: 🧠 Task-05: Miri Full Workspace (UB Detection)
        run: cargo miri test --workspace > ${{ env.REPORT_PATH }}/miri_report.txt 2>&1
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

      - name: 🧬 Task-06: Property Testing (10k cases)
        run: cargo test --workspace --features properties -- --ignored > ${{ env.REPORT_PATH }}/proptest_report.txt 2>&1
        env:
          PROPTEST_CASES: 10000

      - name: ⚡ Task-07: Full Benchmarking & Profiling
        run: cargo bench --workspace > ${{ env.REPORT_PATH }}/bench_full.txt 2>&1

      - name: 🗜️ Task-08: Address Sanitizer (ASAN)
        run: |
          cargo test -p genesis-math --target x86_64-unknown-linux-gnu > ${{ env.REPORT_PATH }}/asan_report.txt 2>&1
        env:
          RUSTFLAGS: "-Zsanitizer=address"

      - name: 📦 Archive Audit Reports
        if: always() # Guarda los logs incluso si algo falla para que veas el error
        uses: actions/upload-artifact@v4
        with:
          name: genesis-deep-audit-${{ github.sha }}
          path: ${{ env.LOG_DIR }}

  # ==========================================
  # NIVEL 3: FUZZING (Solo Domingo / Manual)
  # ==========================================
  fuzzing:
    name: Continuous Fuzzing
    needs: fast-pass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: Run Fuzz Targets
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60
          done
