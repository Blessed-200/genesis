name: GÉNESIS_ELITE_FORGE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Domingo medianoche: Deep Pass
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" 
  LOG_DIR: "genesis_audit_logs"

jobs:
  # ==========================================
  # NIVEL 1: FAST-PASS (Feedback < 5 min)
  # ==========================================
  fast-pass:
    name: Fast-Pass Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: "🛡️ Task-01: Clippy & Fmt (Strict)"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D clippy::pedantic -W clippy::nursery -A clippy::module_name_repetitions

      - name: "🔍 Task-02: Unsafe Safety Audit"
        run: |
          if grep -rn "unsafe {" core/ shared/ | grep -v "// SAFETY:"; then
            echo "Error: Unsafe blocks without SAFETY comment found."
            exit 1
          fi

      - name: "🧪 Task-03: Fast Invariants & Unit Test"
        run: cargo test --workspace --lib --bins

      - name: "🚀 Task-04: Critical Benchmark (Guardrail)"
        run: cargo bench -p genesis-dynamics --bench dynamics -- synchrony_order_fast || echo "Benchmark failed, continuing CI"

  # ==========================================
  # NIVEL 2: DEEP-PASS (Manual / Domingo)
  # ==========================================
  deep-pass:
    name: Deep-Pass (Exhaustive Analysis)
    needs: fast-pass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Prepare Audit Folder
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "REPORT_PATH=$LOG_DIR/$TIMESTAMP" >> $GITHUB_ENV
          mkdir -p $LOG_DIR/$TIMESTAMP

      - name: "🧠 Task-05: Miri Full Workspace (UB Detection)"
        run: cargo miri test --workspace > ${{ env.REPORT_PATH }}/miri_report.txt 2>&1
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

      - name: "🧬 Task-06: Property Testing (10k cases)"
        run: |
          cargo test --workspace --features properties -- --ignored --test-threads=1 --nocapture > ${{ env.REPORT_PATH }}/proptest_report.txt 2>&1
        env:
          PROPTEST_CASES: 10000

      - name: "⚡ Task-07: Full Benchmarking & Profiling"
        run: cargo bench --workspace > ${{ env.REPORT_PATH }}/bench_full.txt 2>&1 || echo "Benchmarks failed, logs saved"

      - name: "🗜️ Task-08: Address Sanitizer (ASAN)"
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo test -p genesis-math --target x86_64-unknown-linux-gnu > ${{ env.REPORT_PATH }}/asan_report.txt 2>&1 || echo "ASAN test failed, continuing"

      - name: "📦 Archive Audit Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-deep-audit-${{ github.sha }}
          path: ${{ env.LOG_DIR }}

  # ==========================================
  # NIVEL 3: FUZZING (Solo Domingo / Manual)
  # ==========================================
  fuzzing:
    name: Continuous Fuzzing
    needs: fast-pass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - name: Run Fuzz Targets
        run: |
          for target in $(cargo fuzz list); do
            echo "Fuzzing target: $target"
            cargo fuzz run "$target" -- -max_total_time=300 -jobs=$(nproc) || echo "Fuzzer $target finished with errors"
          done
