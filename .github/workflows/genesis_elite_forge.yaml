name: GÉNESIS ELITE FORGE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Domingo: Deep Scan (Fuzzing, Full Miri)
  workflow_dispatch: # Permite ejecución manual total desde la UI de GitHub

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" # Fallar ante cualquier warning

jobs:
  # ==========================================
  # FASE 1: VELOCIDAD Y LIMPIEZA (FAST TRACK)
  # ==========================================
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # CACHÉ: Reduce tiempos de build un 70%

      - name: Formato y Clippy Pedantic
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D clippy::pedantic -W clippy::nursery

      - name: Audit Unsafe (Strict)
        run: |
          # Falla si hay unsafe sin comentario de seguridad
          ! grep -rn "unsafe {" core/ shared/ | grep -v "// SAFETY:"

  # ==========================================
  # FASE 2: CORRECTITUD Y MEMORIA (PRECISION)
  # ==========================================
  precision:
    needs: higiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly # Usamos Nightly para Miri/ASAN
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2

      - name: Test de Invariantes Físicos
        run: cargo test --release --workspace

      - name: Miri (Solo Core Math - Rápido)
        run: cargo miri test -p genesis-math
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

      - name: Address Sanitizer (ASAN)
        run: |
          cargo test -p genesis-math --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"

  # ==========================================
  # FASE 3: RENDIMIENTO (GUARDRAILS)
  # ==========================================
  performance:
    needs: precision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Critical Benches
        run: |
          mkdir -p logs/bench_$(date +%Y-%m-%d_%H-%M)
          cargo bench -p genesis-dynamics --bench dynamics > logs/bench_$(date +%Y-%m-%d_%H-%M)/results.txt
          
      - name: Guardar Reporte de Rendimiento
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.sha }}
          path: logs/

  # ==========================================
  # FASE 4: CAOS Y ESTRÉS (WEEKLY / MANUAL)
  # ==========================================
  deep-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      
      - name: Fuzzing (60s por target)
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60
          done

      - name: Miri Workspace Total
        run: cargo miri test --workspace
