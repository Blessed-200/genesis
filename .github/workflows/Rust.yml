name: GENESIS Production Quality Gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 3 * * 0" # Weekly deep scan
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint-build-test:
    name: "01 Lint Build Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-build-test

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, deny warnings)
        run: |
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate

      - name: Workspace check
        run: cargo check --workspace

      - name: Inline(always) topology gate
        run: scripts/check_inline_always_topology.sh

      - name: Workspace tests (debug)
        run: cargo test --workspace --verbose

      - name: Workspace tests (release)
        run: cargo test --workspace --release --verbose

  invariants:
    name: "02 Invariants"
    runs-on: ubuntu-latest
    needs: lint-build-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: invariants

      - name: Property/invariant tests (include ignored)
        run: cargo test --workspace --release -- --include-ignored

      - name: Topology level distribution invariant
        run: cargo test --release -p genesis-topology -- hnsw_level_distribution_m16 --nocapture

      - name: Minkowski signature invariant
        run: cargo test --release -p genesis-math -- canonical_signature_table_matches_precomputed --nocapture

  performance-guardrails:
    name: "03 Performance Guardrails"
    runs-on: ubuntu-latest
    needs: lint-build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: performance

      - name: Build release targets
        run: cargo build --workspace --release

      - name: Run benchmark suite
        run: |
          mkdir -p artifacts/perf
          cargo bench --bench geometry -p genesis-math \
            -- --output-format bencher 2>&1 | tee artifacts/perf/bench_math.txt
          cargo bench --bench topology -p genesis-topology \
            -- --output-format bencher --measurement-time 10 \
            2>&1 | tee artifacts/perf/bench_topology.txt
          cargo bench --bench dynamics -p genesis-dynamics \
            -- --output-format bencher 2>&1 | tee artifacts/perf/bench_dynamics.txt

      - name: Threshold and forensic summary
        run: |
          python3 << 'PY'
          import json
          import re
          import sys
          from pathlib import Path

          RULES = [
              ("artifacts/perf/bench_math.txt", "dense_kernel_g13_16x16", 300.0, "math_dense_kernel_ns"),
              ("artifacts/perf/bench_math.txt", "from_dense_single_pass", 100000.0, "math_from_dense_ns"),
              ("artifacts/perf/bench_topology.txt", "hnsw_insert_1000", 20000000.0, "topology_hnsw_insert_1000_ns"),
              ("artifacts/perf/bench_topology.txt", "hnsw_search_k10_in_1000", 15000.0, "topology_hnsw_search_k10_in_1000_ns"),
          ]

          bench_re = re.compile(r"bench:\s*([0-9,]+(?:\.[0-9]+)?)")
          out = {"results": [], "status": "pass"}

          def classify_cause(label: str, ratio: float) -> str:
              if ratio > 3.0:
                  return "Potential asymptotic or algorithmic regression"
              if ratio > 1.7:
                  return "Likely memory-layout/cache-locality regression"
              if ratio > 1.25:
                  return "Likely micro-architectural regression (branching/allocation/vectorization)"
              return "Within expected variance"

          for file_path, pattern, threshold, label in RULES:
              p = Path(file_path)
              if not p.exists():
                  out["status"] = "fail"
                  out["results"].append({
                      "label": label,
                      "status": "fail",
                      "reason": f"Missing benchmark file: {file_path}",
                  })
                  continue

              value = None
              for line in p.read_text().splitlines():
                  if pattern in line and "bench:" in line:
                      m = bench_re.search(line)
                      if m:
                          value = float(m.group(1).replace(",", ""))
                          break

              if value is None:
                  out["status"] = "fail"
                  out["results"].append({
                      "label": label,
                      "status": "fail",
                      "reason": f"Pattern not found: {pattern}",
                  })
                  continue

              ratio = value / threshold
              status = "pass" if value <= threshold else "fail"
              if status == "fail":
                  out["status"] = "fail"
              out["results"].append({
                  "label": label,
                  "pattern": pattern,
                  "value_ns": value,
                  "threshold_ns": threshold,
                  "ratio": ratio,
                  "status": status,
                  "suspected_cause": classify_cause(label, ratio),
              })

          Path("artifacts/perf/perf_summary.json").write_text(json.dumps(out, indent=2))

          md = ["# Performance Guardrail Summary", ""]
          for item in out["results"]:
              status = item.get("status", "fail").upper()
              md.append(f"- **{item.get('label','unknown')}**: {status}")
              if "value_ns" in item:
                  md.append(f"  - value_ns: {item['value_ns']:.0f}")
                  md.append(f"  - threshold_ns: {item['threshold_ns']:.0f}")
                  md.append(f"  - ratio: {item['ratio']:.2f}")
                  md.append(f"  - suspected_cause: {item['suspected_cause']}")
              else:
                  md.append(f"  - reason: {item.get('reason','n/a')}")
          Path("artifacts/perf/perf_summary.md").write_text("\n".join(md) + "\n")

          print(Path("artifacts/perf/perf_summary.md").read_text())
          if out["status"] != "pass":
              sys.exit(1)
          PY

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts-${{ github.sha }}
          path: artifacts/perf/

  deep-scan:
    name: "04 Deep Scan (scheduled/manual)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: deep-scan

      - name: Miri (math core)
        run: cargo miri test -p genesis-math
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz targets (short horizon)
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60
          done

  production-gate:
    name: "05 Production Gate"
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-build-test, invariants, performance-guardrails]
    steps:
      - name: Final decision
        run: |
          if [[ "${{ needs.lint-build-test.result }}" != "success" ]] || \
             [[ "${{ needs.invariants.result }}" != "success" ]] || \
             [[ "${{ needs.performance-guardrails.result }}" != "success" ]]; then
            echo "❌ GENESIS quality gate failed"
            exit 1
          fi
          echo "✅ GENESIS quality gate passed"
