version: 2.1

orbs:
  node: circleci/node@7.2.1
     
jobs:
  build:
    docker:
      - image: cimg/node:20.11
    parallelism: 4
    resource_class: large
    steps:
      - checkout

      # El orb gestiona la instalación de pnpm con caché y permisos automáticamente
      - node/install-packages:
          pkg-manager: pnpm

      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps

      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            pnpm run serve &
            echo "Waiting for server to be ready..."
            for i in {1..30}; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "Server is ready!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Server failed to start within timeout"
                exit 1
              fi
              echo "Attempt $i: Server not ready yet, waiting..."
              sleep 2
            done
            TESTFILES=$(circleci tests glob "specs/e2e/**/*.spec.ts")
            echo "$TESTFILES" | circleci tests run \
              --command="xargs pnpm playwright test --config=playwright.config.ci.ts --reporter=junit" \
              --verbose \
              --split-by=timings

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  build_and_test:
    jobs:
      - build