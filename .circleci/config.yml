version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.11
    parallelism: 4
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo corepack enable pnpm
            pnpm install
            npx playwright install --with-deps
      - run:
          name: Run tests
          command: |
            mkdir test-results
            export PLAYWRIGHT_JUNIT_OUTPUT_DIR=test-results
            export PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml
            pnpm run serve &
            # Wait for server to be ready
            echo "Waiting for server to be ready..."
            for i in {1..30}; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "Server is ready!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Server failed to start within timeout"
                exit 1
              fi
              echo "Attempt $i: Server not ready yet, waiting..."
              sleep 2
            done
            TESTFILES=$(circleci tests glob "specs/e2e/**/*.spec.ts")
            echo "$TESTFILES" | circleci tests run --command="xargs pnpm playwright test --config=playwright.config.ci.ts --reporter=junit" --verbose --split-by=timings
      - store_test_results:
          path: test-results

workflows:
  version: 2
  build_and_test:
    jobs:
      - build