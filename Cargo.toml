[workspace]
resolver = "2"
members = [
    "shared/genesis-types",
    "core/genesis-math",
    "core/genesis-topology",
    "core/genesis-dynamics",
]

[workspace.dependencies]
genesis-types     = { path = "shared/genesis-types" }
genesis-math      = { path = "core/genesis-math" }
genesis-topology  = { path = "core/genesis-topology" }
thiserror         = "1.0"
bytemuck          = { version = "1.14", features = ["derive"] }
rayon             = "1.10"
proptest          = "1.4"
# tempfile is pinned to <3.14 to avoid getrandom 0.4.x which requires edition2024
# (not available in Rust 1.75). rusty-fork (proptest dep) pulls tempfile in.
tempfile          = "=3.13.0"
criterion         = { version = "0.5", features = ["html_reports"] }
num-complex        = "0.4"
smallvec          = { version = "1.13", features = ["const_generics"] }
arrayvec          = "0.7"
memoffset     = "0.9"
iai-callgrind   = "0.14"
ahash             = "0.8"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"


[profile.release-pgo-gen]
# Builds instrumented binaries that emit `.profraw` data for PGO training runs.
inherits = "release"

[profile.release-pgo-use]
# Consumes merged profile data (`.profdata`) to optimize production release binaries.
inherits = "release"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
