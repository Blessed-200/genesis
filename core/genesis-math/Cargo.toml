[package]
name        = "genesis-math"
version     = "0.2.0"
edition     = "2021"
description = "G(1,3) Clifford algebra substrate — dense multivectors, geometric product, Lorentz-invariant norm"

[dependencies]
genesis-types = { workspace = true }
bytemuck      = { workspace = true }
memoffset     = "0.9"

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[features]
# Feature gate for the 10 000-case property test suite.
# Normal `cargo test` runs deterministic unit tests only (~milliseconds).
# `cargo test --features properties` adds proptest suites (~30 seconds).
properties = []
deterministic_strict = []
avx512 = []  # Enable AVX-512 path (requires nightly or recent stable)
# Opt-in 64B alignment for SparseCliffordVector; disabled by default.
# Data (example `cacheline_batches`, release, contiguous sparse batch):
#   align32/160B: 23.97 Mops/s
#   align64/192B: 22.99 Mops/s (~4.1% slower, higher cache pressure)
cacheline64 = []

[[bench]]
name    = "geometry"
harness = false

[lints]
workspace = true
